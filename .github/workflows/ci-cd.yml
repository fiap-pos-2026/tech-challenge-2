name: CI/CD

on:
  push:
    branches:
      - main
      - feature/tech-challenge-2
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: localhost:32000/tech-challenge-core

jobs:
  # Build + testes automatizados. Roda em qualquer push/PR; falha aqui bloqueia
  # os estágios seguintes (imagem, Terraform, deploy) via `needs`.
  build-and-test:
    name: Build & Test
    runs-on: [self-hosted, wsl2, microk8s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: ./gradlew :core:assemble --console=plain

      - name: Test
        run: ./gradlew :core:test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/test
          retention-days: 7

  # Constrói e publica a imagem Docker no registry local do microk8s.
  # Só roda em push (não em PR de fora do repositório).
  docker-image:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: [self-hosted, wsl2, microk8s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -f core/Dockerfile -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:local .

      - name: Push image to microk8s registry
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:local

  # Provisiona/atualiza namespace, PostgreSQL e Redis via Terraform sobre o cluster
  # microk8s já existente (infra/ — ver infra/README.md). Não instala o cluster.
  terraform-apply:
    name: Terraform Apply (infra)
    needs: docker-image
    if: github.event_name == 'push'
    runs-on: [self-hosted, wsl2, microk8s]
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

  # Aplica os manifests Kustomize da app no microk8s. Falha em qualquer estágio
  # anterior (build, testes, imagem, Terraform) impede que este job execute.
  deploy:
    name: Deploy (kubectl apply -k)
    needs: terraform-apply
    if: github.event_name == 'push'
    runs-on: [self-hosted, wsl2, microk8s]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Kustomize overlay local
        run: kubectl apply -k k8s/overlays/local

      - name: Wait for rollout
        run: kubectl -n tech-challenge rollout status deployment/core --timeout=180s
