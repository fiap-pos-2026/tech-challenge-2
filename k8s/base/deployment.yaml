apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tech-challenge-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tech-challenge-core
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: core
          image: tech-challenge-core:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prd
            - name: JDBC_HOST
              value: postgres
            - name: JDBC_PORT
              value: "5432"
            - name: JDBC_SERVICENAME
              value: techbase
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: MAIL_HOST
              value: mailpit
            - name: MAIL_PORT
              value: "1025"
            # Os PEMs vêm do Secret montado em /run/certs (nunca da imagem)
            - name: JWT_PUBLIC_KEY
              value: file:/run/certs/public.pem
            - name: JWT_PRIVATE_KEY
              value: file:/run/certs/private.pem
            - name: JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-core-secret
                  key: jdbc-username
            - name: JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-core-secret
                  key: jdbc-password
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-core-secret
                  key: mail-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tech-challenge-core-secret
                  key: mail-password
          volumeMounts:
            - name: jwt-certs
              mountPath: /run/certs
              readOnly: true
          startupProbe:
            httpGet:
              path: /core/actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /core/actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /core/actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          # requests são obrigatórios para o HPA calcular utilização de CPU/memória
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: jwt-certs
          secret:
            secretName: tech-challenge-core-secret
            items:
              - key: jwt-public-key
                path: public.pem
              - key: jwt-private-key
                path: private.pem
